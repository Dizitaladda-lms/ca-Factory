<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gear Teeth in Brand Gold #F5A623 -->
  <g fill="#F5A623">
    <!-- 8 Gear cogs around circumference -->
    <rect x="42" y="2" width="16" height="16" rx="4" />
    <rect x="42" y="82" width="16" height="16" rx="4" />
    <rect x="2" y="42" width="16" height="16" rx="4" />
    <rect x="82" y="42" width="16" height="16" rx="4" />
    <rect x="14" y="14" width="16" height="16" rx="4" transform="rotate(45 22 22)" />
    <rect x="70" y="14" width="16" height="16" rx="4" transform="rotate(45 78 22)" />
    <rect x="14" y="70" width="16" height="16" rx="4" transform="rotate(45 22 78)" />
    <rect x="70" y="70" width="16" height="16" rx="4" transform="rotate(45 78 78)" />
    <!-- Gear Outer Ring -->
    <circle cx="50" cy="50" r="38" />
  </g>
  <!-- Gear Dark Center Circle -->
  <circle cx="50" cy="50" r="28" fill="#0F172A" />
  <!-- "CS" Text in Center in Brand Gold -->
  <text x="50" y="58" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900" fill="#F5A623" text-anchor="middle" letter-spacing="-0.5">CS</text>
</svg>